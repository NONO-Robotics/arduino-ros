[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<FWAngularSpeedWriter.cpp>
    +<IMUMsgWriter.cpp>
    +<NavSatFixMsgWriter.cpp>
    +<RosMessage.cpp>
    +<Logger.cpp>
lib_deps =
    https://github.com/NONO-Robotics/arduino-commons.git
; commons' transitive deps are mocked in test/mocks — real libs shadow the mocks
lib_ignore =
    ArduinoJson
    EWMA
    TinyGPSPlus
    U8g2
    Adafruit BNO08x
    Adafruit BusIO
    Adafruit Unified Sensor
build_flags =
    -I test/mocks
    -I test/support
    -I include
    -std=gnu++17
    -fprofile-arcs
    -ftest-coverage
    -lgcov
